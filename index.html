<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RabbitMQ 互動式視覺化展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 + ReactDOM (UMD) for the Direct/Fanout tab -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone: transforms JSX in-browser -->
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js" crossorigin></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 500px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .log-container::-webkit-scrollbar { width: 8px; }
        .log-container::-webkit-scrollbar-track { background: #f1f5f9; }
        .log-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .log-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* React tab custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .animate-slide-in-right { animation: slideInRight 0.2s ease-out forwards; }
        .loader-dots::after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%,  20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            40%       { color: inherit;        text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            60%       {                         text-shadow: .25em 0 0 inherit,        .5em 0 0 rgba(0,0,0,0); }
            80%, 100% {                         text-shadow: .25em 0 0 inherit,        .5em 0 0 inherit; }
        }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <!-- ===== Top Navigation ===== -->
    <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 md:px-6 flex items-center gap-2 h-14">
            <span class="font-bold text-slate-700 mr-4 text-lg hidden sm:inline">🐇 RabbitMQ Demo</span>
            <button id="tab-btn-dlx"
                onclick="switchTab('dlx')"
                class="tab-nav-btn px-4 py-2 rounded-lg text-sm font-semibold transition-colors bg-orange-600 text-white shadow">
                DLX 死信機制
            </button>
            <button id="tab-btn-react"
                onclick="switchTab('react')"
                class="tab-nav-btn px-4 py-2 rounded-lg text-sm font-semibold transition-colors text-slate-600 hover:bg-slate-100">
                Direct vs Fanout
            </button>
        </div>
    </nav>

    <!-- ===== Tab 1 : DLX Dead-Letter demo (Canvas) ===== -->
    <div id="tab-dlx" class="tab-panel active p-4 md:p-6 flex flex-col gap-4 flex-grow">

    <!-- 上半部：控制面板與 Canvas -->
    <div class="max-w-7xl w-full mx-auto bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col xl:flex-row border border-slate-200 flex-grow">
        
        <!-- 左側控制面板 -->
        <div class="w-full xl:w-80 bg-slate-100 p-5 flex flex-col gap-5 border-r border-slate-200 shadow-inner z-10 shrink-0 overflow-y-auto">
            <div>
                <h1 class="text-xl font-bold text-slate-800 mb-1">RabbitMQ 流程展示</h1>
                <p class="text-xs text-slate-500 mb-2">死信產生與後續處理機制</p>
            </div>

            <!-- 操作區 -->
            <div class="flex flex-col gap-3 text-sm">
                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                    <h2 class="font-semibold text-slate-700 mb-2">1. 訊息生產者</h2>
                    <div class="flex gap-2">
                        <button id="btn-send" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-1.5 px-3 rounded transition-colors text-xs">
                            單筆發送
                        </button>
                        <button id="btn-auto" class="flex-1 bg-slate-600 hover:bg-slate-700 text-white font-medium py-1.5 px-3 rounded transition-colors text-xs">
                            自動發送
                        </button>
                    </div>
                </div>

                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2">
                    <h2 class="font-semibold text-slate-700">2. 主佇列設定 (觸發 DLX)</h2>
                    
                    <div>
                        <label class="block text-xs text-slate-600 mb-1 flex justify-between">
                            <span>TTL 存活時間 (毫秒)</span>
                            <span id="ttl-val" class="font-mono text-blue-600">3000</span>
                        </label>
                        <input type="range" id="ttl-slider" min="1000" max="10000" step="500" value="3000" class="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div>
                        <label class="block text-xs text-slate-600 mb-1 flex justify-between">
                            <span>最大長度限制 (筆)</span>
                            <span id="maxlen-val" class="font-mono text-blue-600">5</span>
                        </label>
                        <input type="range" id="maxlen-slider" min="1" max="10" step="1" value="5" class="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>

                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                    <h2 class="font-semibold text-slate-700 mb-2">3. 主消費者狀態</h2>
                    <select id="consumer-state" class="w-full border border-slate-300 rounded p-1.5 text-xs bg-slate-50 outline-none focus:border-blue-500">
                        <option value="active">🟢 正常消費</option>
                        <option value="offline">⚫ 停機 (累積訊息)</option>
                        <option value="reject">🔴 拒絕 (觸發 DLX)</option>
                    </select>
                </div>

                <div class="bg-red-50 p-3 rounded-xl border border-red-100 shadow-sm">
                    <h2 class="font-semibold text-red-800 mb-2">4. 死信處理端 (DLX Consumer)</h2>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-slate-700">處理模式：</span>
                        <select id="dlx-action" class="border border-red-200 rounded p-1 text-xs bg-white text-red-700 outline-none">
                            <option value="log">📝 記錄後捨棄</option>
                            <option value="requeue">🔄 修正後重送</option>
                            <option value="pause">⏸️ 暫停處理 (堆積)</option>
                        </select>
                    </div>
                    <button id="btn-process-dlq" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-1.5 px-3 rounded transition-colors text-xs">
                        手動處理一筆死信
                    </button>
                </div>
            </div>
        </div>

        <!-- 右側 Canvas 區 -->
        <div class="flex-grow bg-white relative flex flex-col">
            <!-- 圖例 -->
            <div class="absolute top-2 right-2 bg-white/90 backdrop-blur p-2 rounded shadow border border-slate-100 text-[10px] flex gap-3 z-10 pointer-events-none">
                <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500"></span>正常</div>
                <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-orange-500"></span>TTL過期</div>
                <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-500"></span>滿載溢出</div>
                <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-purple-500"></span>被拒絕</div>
                <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-400"></span>重送中</div>
            </div>
            
            <div class="canvas-container flex-grow" id="canvas-wrapper">
                <canvas id="rmq-canvas"></canvas>
                <!-- 浮動提示框 (Tooltip) -->
                <div id="tooltip" class="absolute hidden bg-gray-800 text-white text-xs px-2 py-1 rounded pointer-events-none z-20 whitespace-nowrap shadow-lg"></div>
            </div>
        </div>
    </div>

    <!-- 下半部：即時事件紀錄 Log -->
    <div class="max-w-7xl w-full mx-auto bg-slate-900 rounded-xl shadow-lg overflow-hidden flex flex-col h-64 border border-slate-800">
        <div class="bg-slate-800 p-2 border-b border-slate-700 flex justify-between items-center shrink-0">
            <h3 class="text-slate-200 text-sm font-mono flex items-center gap-2">
                <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> 系統事件紀錄 (Event Log)
            </h3>
            <button id="btn-clear-log" class="text-xs text-slate-400 hover:text-white px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 transition">清除紀錄</button>
        </div>
        <div id="log-container" class="log-container p-3 overflow-y-auto flex-grow font-mono text-xs text-slate-300 flex flex-col gap-1">
            <!-- Logs will be appended here -->
        </div>
    </div>

    </div><!-- end #tab-dlx -->

    <!-- ===== Tab 2 : Direct vs Fanout demo (React) ===== -->
    <div id="tab-react" class="tab-panel">
        <div id="react-root"></div>
    </div>

<script>
    // ===== Tab Switching =====
    function switchTab(name) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-nav-btn').forEach(b => {
            b.classList.remove('bg-orange-600', 'text-white', 'shadow');
            b.classList.add('text-slate-600', 'hover:bg-slate-100');
        });

        document.getElementById('tab-' + name).classList.add('active');
        const activeBtn = document.getElementById('tab-btn-' + name);
        activeBtn.classList.add('bg-orange-600', 'text-white', 'shadow');
        activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-100');

        // Re-size the canvas when returning to the DLX tab
        if (name === 'dlx') {
            setTimeout(resizeCanvas, 50);
        }
    }

    // --- 系統設定 ---
    const config = {
        ttl: 3000,
        maxLength: 5,
        consumerState: 'active', // 'active', 'offline', 'reject'
        consumerSpeed: 1500,     
        messageSpeed: 0.04,      // 稍微放慢讓流程更清楚
        autoSend: false,
        dlxAction: 'log',        // 'log', 'requeue', 'pause'
        dlxProcessSpeed: 2000
    };

    // --- DOM 元件綁定 ---
    const wrapper = document.getElementById('canvas-wrapper');
    const canvas = document.getElementById('rmq-canvas');
    const ctx = canvas.getContext('2d');
    
    // UI Controls
    const btnSend = document.getElementById('btn-send');
    const btnAuto = document.getElementById('btn-auto');
    const ttlSlider = document.getElementById('ttl-slider');
    const ttlVal = document.getElementById('ttl-val');
    const maxlenSlider = document.getElementById('maxlen-slider');
    const maxlenVal = document.getElementById('maxlen-val');
    const consumerStateSelect = document.getElementById('consumer-state');
    
    // DLX UI
    const dlxActionSelect = document.getElementById('dlx-action');
    const btnProcessDlq = document.getElementById('btn-process-dlq');
    
    // Log UI
    const logContainer = document.getElementById('log-container');
    const btnClearLog = document.getElementById('btn-clear-log');
    const tooltip = document.getElementById('tooltip');

    // --- Canvas 響應式調整 ---
    let width, height;
    function resizeCanvas() {
        // 設定實際像素大小以保持清晰度
        const rect = wrapper.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        width = rect.width;
        height = rect.height;
        updateNodesLayout();
    }
    window.addEventListener('resize', resizeCanvas);

    // --- 節點架構定義 ---
    const nodes = {
        producer:    { x: 0, y: 0, type: 'actor', label: 'Producer', color: '#3b82f6', icon: '👤' },
        mainEx:      { x: 0, y: 0, type: 'exchange', label: 'Main EX', color: '#0ea5e9' },
        mainQ:       { x: 0, y: 0, type: 'queue', label: 'Main Queue', color: '#22c55e' },
        consumer:    { x: 0, y: 0, type: 'actor', label: 'Main App', color: '#10b981', icon: '💻' },
        dlx:         { x: 0, y: 0, type: 'exchange', label: 'DLX', color: '#ef4444' },
        dlq:         { x: 0, y: 0, type: 'queue', label: 'DLQ', color: '#dc2626' },
        dlxConsumer: { x: 0, y: 0, type: 'actor', label: 'DLX Handler', color: '#b91c1c', icon: '🛠️' }
    };

    function updateNodesLayout() {
        const cx = width / 2;
        const cyTop = 100;
        const cyBottom = 320;
        
        // 上半部：正常流程
        nodes.producer.x = cx - 350; nodes.producer.y = cyTop;
        nodes.mainEx.x = cx - 180;   nodes.mainEx.y = cyTop;
        nodes.mainQ.x = cx + 50;     nodes.mainQ.y = cyTop;
        nodes.consumer.x = cx + 300; nodes.consumer.y = cyTop;
        
        // 下半部：死信流程
        nodes.dlx.x = cx - 180;       nodes.dlx.y = cyBottom; // 對齊 MainEX
        nodes.dlq.x = cx + 50;        nodes.dlq.y = cyBottom; // 對齊 MainQ
        nodes.dlxConsumer.x = cx + 300; nodes.dlxConsumer.y = cyBottom; // 對齊 Main Consumer
    }

    // --- 模擬狀態與資料結構 ---
    let messages = [];
    let mainQueueArr = [];
    let dlQueueArr = [];
    let lastConsumeTime = 0;
    let lastDlxProcessTime = 0;
    let autoSendInterval = null;
    let msgCounter = 1;

    // --- Logger 系統 ---
    function addLog(msgId, action, detail, type = 'info') {
        const time = new Date().toLocaleTimeString('zh-TW', { hour12: false, fractionalSecondDigits: 2 });
        const el = document.createElement('div');
        
        let colorClass = 'text-slate-300';
        if(type === 'error') colorClass = 'text-red-400';
        if(type === 'warn') colorClass = 'text-orange-400';
        if(type === 'success') colorClass = 'text-green-400';
        if(type === 'requeue') colorClass = 'text-blue-400';

        el.className = `flex gap-3 hover:bg-slate-800 p-1 rounded transition ${colorClass}`;
        el.innerHTML = `
            <span class="text-slate-500 shrink-0">[${time}]</span>
            <span class="font-bold shrink-0 w-16">MSG-${msgId}</span>
            <span class="font-semibold shrink-0 w-24">[${action}]</span>
            <span class="truncate">${detail}</span>
        `;
        logContainer.appendChild(el);
        // 自動捲動到底部
        logContainer.scrollTop = logContainer.scrollHeight;
    }

    // --- 訊息類別 ---
    class Message {
        constructor(isRetry = false) {
            this.id = String(msgCounter++).padStart(3, '0');
            this.isRetry = isRetry;
            
            if (isRetry) {
                // 如果是重送的訊息，從 DLX Handler 出發
                this.x = nodes.dlxConsumer.x;
                this.y = nodes.dlxConsumer.y - 30;
                this.stage = 'requeue_to_main_ex';
                this.targetX = nodes.mainEx.x;
                this.targetY = nodes.mainEx.y - 50; // 繞上面回去
                this.color = '#60a5fa'; // Blue for retry
                addLog(this.id, 'REQUEUE', '死信處理常式修正訊息，重新發送至主交換機', 'requeue');
            } else {
                // 正常發送
                this.x = nodes.producer.x;
                this.y = nodes.producer.y;
                this.stage = 'to_main_ex'; 
                this.targetX = nodes.mainEx.x;
                this.targetY = nodes.mainEx.y;
                this.color = '#22c55e'; // Green
                addLog(this.id, 'PUBLISH', '生產者發送新訊息');
            }
            
            this.createdAt = Date.now();
            this.queueEntryTime = 0;
            this.deadReason = null;
            this.opacity = 1;
            
            // 讓訊息繪製時稍微偏離中心，避免重疊
            this.offsetY = (Math.random() - 0.5) * 10;
        }

        update() {
            // 平滑移動
            const dx = this.targetX - this.x;
            const dy = (this.targetY + this.offsetY) - this.y;
            this.x += dx * config.messageSpeed;
            this.y += dy * config.messageSpeed;

            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < 5) {
                this.handleStageTransition();
            }

            // 檢查 TTL (只在主佇列中檢查)
            if (this.stage === 'in_main_q') {
                const age = Date.now() - this.queueEntryTime;
                if (age >= config.ttl) {
                    this.makeDeadLetter('ttl');
                }
            }
        }

        handleStageTransition() {
            switch (this.stage) {
                case 'requeue_to_main_ex':
                case 'to_main_ex':
                    this.stage = 'to_main_q';
                    this.targetX = nodes.mainQ.x - 70; // 佇列入口
                    this.targetY = nodes.mainQ.y;
                    if(this.stage === 'to_main_q' && !this.isRetry) addLog(this.id, 'ROUTING', '主交換機路由至主佇列');
                    break;
                    
                case 'to_main_q':
                    if (mainQueueArr.length >= config.maxLength) {
                        const oldestMsg = mainQueueArr.shift();
                        if(oldestMsg) oldestMsg.makeDeadLetter('maxlen');
                    }
                    this.stage = 'in_main_q';
                    this.queueEntryTime = Date.now();
                    mainQueueArr.push(this);
                    addLog(this.id, 'ENQUEUE', `進入主佇列等待消費 (當前長度: ${mainQueueArr.length})`);
                    break;
                    
                case 'to_consumer':
                    this.stage = 'consumed';
                    addLog(this.id, 'CONSUMED', '主應用程式成功處理訊息', 'success');
                    break;
                    
                case 'to_dlx':
                    this.stage = 'to_dlq';
                    this.targetX = nodes.dlq.x - 70;
                    this.targetY = nodes.dlq.y;
                    addLog(this.id, 'DLX_ROUTE', '死信交換機路由至死信佇列 (DLQ)', 'warn');
                    break;
                    
                case 'to_dlq':
                    this.stage = 'in_dlq';
                    dlQueueArr.push(this);
                    addLog(this.id, 'DLQ_ENQUEUE', `進入死信佇列等待人工/排程處理 (DLQ長度: ${dlQueueArr.length})`, 'error');
                    break;
                    
                case 'to_dlx_consumer':
                    this.stage = 'dlx_processed';
                    break;
                    
                case 'consumed':
                case 'dlx_processed':
                    this.opacity -= 0.05;
                    if(this.opacity < 0) this.opacity = 0;
                    break;
            }
        }

        makeDeadLetter(reason) {
            this.stage = 'to_dlx';
            this.deadReason = reason;
            this.targetX = nodes.dlx.x;
            this.targetY = nodes.dlx.y;
            
            let reasonText = "";
            if(reason === 'ttl') {
                this.color = '#f97316'; // Orange
                reasonText = `TTL 過期 (${config.ttl}ms)`;
                addLog(this.id, 'DEAD_LETTER', reasonText, 'warn');
            } else if(reason === 'maxlen') {
                this.color = '#ef4444'; // Red
                reasonText = "主佇列滿載，舊訊息被擠出";
                addLog(this.id, 'DEAD_LETTER', reasonText, 'error');
            } else if(reason === 'reject') {
                this.color = '#a855f7'; // Purple
                reasonText = "消費者拒絕 (basic.reject, requeue=false)";
                addLog(this.id, 'DEAD_LETTER', reasonText, 'error');
            }

            const idx = mainQueueArr.indexOf(this);
            if (idx > -1) mainQueueArr.splice(idx, 1);
        }

        draw(ctx) {
            ctx.save();
            ctx.globalAlpha = this.opacity;
            
            // 畫訊息圓點
            ctx.beginPath();
            ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.stroke();
            
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.fill();
            
            // 畫 ID
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 8px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.id, this.x, this.y);
            
            ctx.restore();
        }
        
        // 用於 Hover 判斷
        isPointInside(x, y) {
            const dx = this.x - x;
            const dy = this.y - y;
            return Math.sqrt(dx*dx + dy*dy) <= 12; // 感應範圍稍微大一點
        }
    }

    // --- 繪圖輔助函數 ---
    function drawConnection(x1, y1, x2, y2, type = 'normal') {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        
        if (type === 'dlx') {
            // 從主佇列掉落到 DLX
            ctx.lineTo(x1, y2); 
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = '#fca5a5';
            ctx.setLineDash([5, 5]);
        } else if (type === 'requeue') {
            // 從 DLX Handler 繞回 Main EX
            ctx.bezierCurveTo(x1, y1 - 150, x2, y2 - 150, x2, y2);
            ctx.strokeStyle = '#93c5fd';
            ctx.setLineDash([8, 4]);
        } else {
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = '#cbd5e1';
            ctx.setLineDash([]);
        }
        
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]); // reset
    }

    function drawNode(node) {
        ctx.save();
        ctx.translate(node.x, node.y);

        if (node.type === 'actor') {
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = node.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(-45, -30, 90, 60, 8);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#334155';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(node.label, 0, 20);
            ctx.font = '24px sans-serif';
            ctx.fillText(node.icon, 0, -2);
            
            // 狀態指示燈
            if(node.label === 'Main App') {
                ctx.beginPath();
                ctx.arc(35, -20, 5, 0, Math.PI*2);
                ctx.fillStyle = config.consumerState === 'active' ? '#10b981' : (config.consumerState === 'reject' ? '#ef4444' : '#64748b');
                ctx.fill();
            } else if (node.label === 'DLX Handler') {
                ctx.beginPath();
                ctx.arc(35, -20, 5, 0, Math.PI*2);
                ctx.fillStyle = config.dlxAction === 'pause' ? '#64748b' : '#ef4444';
                ctx.fill();
            }

        } else if (node.type === 'exchange') {
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = node.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = node.color;
            ctx.font = 'bold 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('X', 0, 0);

            ctx.fillStyle = '#475569';
            ctx.font = '12px sans-serif';
            ctx.fillText(node.label, 0, 45);

        } else if (node.type === 'queue') {
            ctx.fillStyle = '#f8fafc';
            ctx.strokeStyle = node.color;
            ctx.lineWidth = 3;
            
            // 畫 Queue 外框
            ctx.beginPath();
            ctx.moveTo(-70, -25);
            ctx.lineTo(70, -25);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-70, 25);
            ctx.lineTo(70, 25);
            ctx.stroke();

            ctx.fillStyle = '#475569';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(node.label, 0, -35);

            // 容量文字
            if (node.label === 'Main Queue') {
                ctx.font = '11px sans-serif';
                ctx.fillStyle = mainQueueArr.length >= config.maxLength ? '#ef4444' : '#64748b';
                ctx.fillText(`(${mainQueueArr.length}/${config.maxLength})`, 0, 42);
            } else {
                ctx.font = '11px sans-serif';
                ctx.fillStyle = dlQueueArr.length > 0 ? '#dc2626' : '#64748b';
                ctx.fillText(`(Total: ${dlQueueArr.length})`, 0, 42);
            }
        }

        ctx.restore();
    }

    // --- 滑鼠互動 (Tooltip) ---
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        // 考慮 devicePixelRatio 與 CSS 縮放
        const scaleX = canvas.width / rect.width / window.devicePixelRatio;
        const scaleY = canvas.height / rect.height / window.devicePixelRatio;
        
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        let hoveredMsg = null;
        for (let msg of messages) {
            if (msg.isPointInside(mouseX, mouseY) && msg.opacity > 0.5) {
                hoveredMsg = msg;
                break;
            }
        }

        if (hoveredMsg) {
            tooltip.style.display = 'block';
            tooltip.style.left = (e.clientX + 10) + 'px';
            tooltip.style.top = (e.clientY + 10) + 'px';
            
            let statusStr = hoveredMsg.stage;
            if(hoveredMsg.stage === 'in_main_q') {
                const age = Math.round((Date.now() - hoveredMsg.queueEntryTime)/1000);
                statusStr = `等待中 (已過 ${age}s / TTL: ${config.ttl/1000}s)`;
            } else if (hoveredMsg.deadReason) {
                statusStr = `死信原因: ${hoveredMsg.deadReason}`;
            }

            tooltip.innerHTML = `
                <div><strong>MSG-${hoveredMsg.id}</strong></div>
                <div>狀態: ${statusStr}</div>
            `;
            canvas.style.cursor = 'pointer';
        } else {
            tooltip.style.display = 'none';
            canvas.style.cursor = 'default';
        }
    });

    canvas.addEventListener('mouseout', () => {
        tooltip.style.display = 'none';
    });


    // --- 主迴圈 ---
    function animate() {
        ctx.clearRect(0, 0, width, height);

        // 1. 畫連接線
        // 主流程
        drawConnection(nodes.producer.x + 45, nodes.producer.y, nodes.mainEx.x - 30, nodes.mainEx.y);
        drawConnection(nodes.mainEx.x + 30, nodes.mainEx.y, nodes.mainQ.x - 70, nodes.mainQ.y);
        drawConnection(nodes.mainQ.x + 70, nodes.mainQ.y, nodes.consumer.x - 45, nodes.consumer.y);
        
        // 死信路由 (MainQ -> DLX)
        drawConnection(nodes.mainQ.x, nodes.mainQ.y + 25, nodes.dlx.x, nodes.dlx.y - 30, 'dlx');
        // 死信佇列與消費者 (DLX -> DLQ -> Handler)
        drawConnection(nodes.dlx.x + 30, nodes.dlx.y, nodes.dlq.x - 70, nodes.dlq.y);
        drawConnection(nodes.dlq.x + 70, nodes.dlq.y, nodes.dlxConsumer.x - 45, nodes.dlxConsumer.y);
        
        // 重送路線 (Handler -> MainEX)
        if (config.dlxAction === 'requeue') {
            drawConnection(nodes.dlxConsumer.x, nodes.dlxConsumer.y - 30, nodes.mainEx.x, nodes.mainEx.y - 30, 'requeue');
        }

        // 2. 畫節點
        Object.values(nodes).forEach(node => drawNode(node));

        // 3. 計算佇列內位置
        mainQueueArr.forEach((msg, i) => {
            msg.targetX = nodes.mainQ.x + 50 - (i * 18);
            msg.targetY = nodes.mainQ.y;
        });
        
        dlQueueArr.forEach((msg, i) => {
            msg.targetX = nodes.dlq.x + 50 - ((i % 8) * 16); 
            msg.targetY = nodes.dlq.y + Math.floor(i / 8) * -8; // 滿了往上疊
        });

        const now = Date.now();

        // 4. 主消費者邏輯
        if (config.consumerState !== 'offline' && now - lastConsumeTime > config.consumerSpeed) {
            if (mainQueueArr.length > 0) {
                const msgToConsume = mainQueueArr.shift();
                
                if (config.consumerState === 'active') {
                    msgToConsume.stage = 'to_consumer';
                    msgToConsume.targetX = nodes.consumer.x;
                    msgToConsume.targetY = nodes.consumer.y;
                } else if (config.consumerState === 'reject') {
                    msgToConsume.makeDeadLetter('reject');
                }
                lastConsumeTime = now;
            }
        }

        // 5. DLX 消費者邏輯 (自動處理 DLQ)
        if (config.dlxAction !== 'pause' && now - lastDlxProcessTime > config.dlxProcessSpeed) {
            if (dlQueueArr.length > 0) {
                const dlMsg = dlQueueArr.shift();
                dlMsg.stage = 'to_dlx_consumer';
                dlMsg.targetX = nodes.dlxConsumer.x;
                dlMsg.targetY = nodes.dlxConsumer.y;
                
                if (config.dlxAction === 'log') {
                    addLog(dlMsg.id, 'DLX_CONSUME', '處理常式記錄死信內容，隨後將其捨棄', 'info');
                } else if (config.dlxAction === 'requeue') {
                    // 產生一個新的訊息代替重送
                    setTimeout(() => {
                        const retryMsg = new Message(true);
                        retryMsg.id = dlMsg.id + '-R'; // 標示為重送
                        messages.push(retryMsg);
                    }, 500); // 動畫稍微延遲感
                }
                
                lastDlxProcessTime = now;
            }
        }

        // 6. 更新並繪製訊息
        for (let i = messages.length - 1; i >= 0; i--) {
            const msg = messages[i];
            msg.update();
            msg.draw(ctx);
            
            if ((msg.stage === 'consumed' || msg.stage === 'dlx_processed') && msg.opacity <= 0) {
                messages.splice(i, 1);
            }
        }

        requestAnimationFrame(animate);
    }

    // --- 事件監聽 ---
    function spawnMessage() {
        messages.push(new Message());
    }

    btnSend.addEventListener('click', spawnMessage);

    btnAuto.addEventListener('click', () => {
        config.autoSend = !config.autoSend;
        if (config.autoSend) {
            btnAuto.classList.replace('bg-slate-600', 'bg-blue-600');
            btnAuto.textContent = '停止發送';
            addLog('SYS', 'CONFIG', '啟動生產者自動發送');
            autoSendInterval = setInterval(spawnMessage, 1000);
        } else {
            btnAuto.classList.replace('bg-blue-600', 'bg-slate-600');
            btnAuto.textContent = '自動發送';
            addLog('SYS', 'CONFIG', '停止生產者自動發送');
            clearInterval(autoSendInterval);
        }
    });

    ttlSlider.addEventListener('input', (e) => {
        config.ttl = parseInt(e.target.value);
        ttlVal.textContent = config.ttl;
    });
    ttlSlider.addEventListener('change', () => addLog('SYS', 'CONFIG', `修改主佇列 TTL 為 ${config.ttl}ms`));

    maxlenSlider.addEventListener('input', (e) => {
        config.maxLength = parseInt(e.target.value);
        maxlenVal.textContent = config.maxLength;
        while(mainQueueArr.length > config.maxLength) {
            const msg = mainQueueArr.shift();
            if(msg) msg.makeDeadLetter('maxlen');
        }
    });
    maxlenSlider.addEventListener('change', () => addLog('SYS', 'CONFIG', `修改主佇列最大長度為 ${config.maxLength}`));

    consumerStateSelect.addEventListener('change', (e) => {
        config.consumerState = e.target.value;
        const stateName = e.target.options[e.target.selectedIndex].text;
        addLog('SYS', 'CONFIG', `主應用程式狀態變更為: ${stateName}`);
    });

    dlxActionSelect.addEventListener('change', (e) => {
        config.dlxAction = e.target.value;
        const actionName = e.target.options[e.target.selectedIndex].text;
        addLog('SYS', 'CONFIG', `死信處理模式變更為: ${actionName}`);
    });

    btnProcessDlq.addEventListener('click', () => {
        if (dlQueueArr.length > 0) {
            // 強制觸發一次處理
            lastDlxProcessTime = 0; 
            // 暫時確保不會被 pause 阻擋單次執行
            const currentAction = config.dlxAction;
            if(currentAction === 'pause') {
                config.dlxAction = 'log'; // 單次手動預設為 log
                setTimeout(()=> { config.dlxAction = 'pause'; }, 100);
            }
        } else {
            addLog('SYS', 'INFO', '目前死信佇列為空');
        }
    });

    btnClearLog.addEventListener('click', () => {
        logContainer.innerHTML = '';
        addLog('SYS', 'INFO', '日誌已清空');
    });

    // --- 啟動初始化 ---
    resizeCanvas();
    addLog('SYS', 'INIT', 'RabbitMQ 死信視覺化系統啟動完成', 'success');
    animate();

</script>

<!-- ===== React component: Direct vs Fanout simulator ===== -->
<script type="text/babel">
(function() {
    const { useState, useEffect, useCallback, useRef } = React;

    // ── Inline icon components (Lucide-style SVGs) ──────────────────────────
    const Icon = ({ children, size = 24, className = '' }) => (
        <svg className={className} width={size} height={size} viewBox="0 0 24 24"
             fill="none" stroke="currentColor" strokeWidth="2"
             strokeLinecap="round" strokeLinejoin="round">
            {children}
        </svg>
    );

    const Network = (p) => <Icon {...p}>
        <rect x="16" y="16" width="6" height="6" rx="1"/>
        <rect x="2" y="16" width="6" height="6" rx="1"/>
        <rect x="9" y="2" width="6" height="6" rx="1"/>
        <path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/>
        <path d="M12 12V8"/>
    </Icon>;

    const List = (p) => <Icon {...p}>
        <line x1="8" x2="21" y1="6" y2="6"/>
        <line x1="8" x2="21" y1="12" y2="12"/>
        <line x1="8" x2="21" y1="18" y2="18"/>
        <line x1="3" x2="3.01" y1="6" y2="6"/>
        <line x1="3" x2="3.01" y1="12" y2="12"/>
        <line x1="3" x2="3.01" y1="18" y2="18"/>
    </Icon>;

    const MonitorPlay = (p) => <Icon {...p}>
        <path d="m10 7 5 3-5 3Z"/>
        <rect width="20" height="14" x="2" y="3" rx="2"/>
        <path d="M12 17v4"/>
        <path d="M8 21h8"/>
    </Icon>;

    const Send = (p) => <Icon {...p}>
        <path d="m22 2-7 20-4-9-9-4Z"/>
        <path d="M22 2 11 13"/>
    </Icon>;

    const Plus = (p) => <Icon {...p}>
        <path d="M5 12h14"/>
        <path d="M12 5v14"/>
    </Icon>;

    const Minus = (p) => <Icon {...p}>
        <path d="M5 12h14"/>
    </Icon>;

    const Info = (p) => <Icon {...p}>
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4"/>
        <path d="M12 8h.01"/>
    </Icon>;

    const Settings2 = (p) => <Icon {...p}>
        <path d="M20 7h-9"/>
        <path d="M14 17H5"/>
        <circle cx="17" cy="17" r="3"/>
        <circle cx="7" cy="7" r="3"/>
    </Icon>;

    const GitMerge = (p) => <Icon {...p}>
        <circle cx="18" cy="18" r="3"/>
        <circle cx="6" cy="6" r="3"/>
        <path d="M6 21V9a9 9 0 0 0 9 9"/>
    </Icon>;

    // ── Helpers ──────────────────────────────────────────────────────────────
    const COLORS = ['bg-rose-500','bg-cyan-500','bg-emerald-500','bg-amber-500','bg-violet-500','bg-fuchsia-500'];
    const generateId = () => Math.random().toString(36).substr(2, 9);

    const MAX_LOG_ENTRIES            = 50;
    const AUTO_PRODUCE_INTERVAL_MS   = 1500;
    const MESSAGE_PROCESSING_DURATION_MS = 2500;
    const CONSUMER_POLL_INTERVAL_MS  = 500;

    // ── Main App ─────────────────────────────────────────────────────────────
    function App() {
        const [exchangeType, setExchangeType] = useState('direct');
        const [messageCounter, setMessageCounter] = useState(0);
        const [currentRoutingKey, setCurrentRoutingKey] = useState('info');
        const [isAutoProduce, setIsAutoProduce] = useState(false);

        const [queues, setQueues] = useState([
            { id: 'Q1', name: 'Log Queue',   bindingKey: 'info',  messages: [] },
            { id: 'Q2', name: 'Alert Queue', bindingKey: 'error', messages: [] }
        ]);

        const [consumers, setConsumers] = useState([
            { id: 'C1', targetQueue: 'Q1', state: 'idle', currentMsg: null },
            { id: 'C2', targetQueue: 'Q2', state: 'idle', currentMsg: null }
        ]);

        const [logs, setLogs] = useState([]);
        const endOfLogsRef = useRef(null);
        const queuesRef = useRef(queues);
        const consumersRef = useRef(consumers);

        useEffect(() => { queuesRef.current = queues; consumersRef.current = consumers; }, [queues, consumers]);

        const addLog = useCallback((msg) => {
            setLogs(prev => [...prev, { id: generateId(), time: new Date().toLocaleTimeString(), text: msg }].slice(-MAX_LOG_ENTRIES));
        }, []);

        useEffect(() => { endOfLogsRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [logs]);

        // Producer
        const produceMessage = useCallback(() => {
            const newMessage = {
                id: generateId(),
                text: `Msg-${messageCounter}`,
                routingKey: currentRoutingKey,
                color: COLORS[messageCounter % COLORS.length]
            };
            let routedCount = 0;
            setQueues(prev => prev.map(q => {
                let shouldReceive = false;
                if (exchangeType === 'fanout') shouldReceive = true;
                else if (exchangeType === 'direct' && q.bindingKey === newMessage.routingKey) shouldReceive = true;
                if (shouldReceive) { routedCount++; return { ...q, messages: [...q.messages, newMessage] }; }
                return q;
            }));
            if (routedCount > 0) addLog(`[Exchange] 收到 ${newMessage.text} (RK: ${newMessage.routingKey})，已路由至 ${routedCount} 個 Queue`);
            else addLog(`[Exchange] ⚠️ 收到 ${newMessage.text} (RK: ${newMessage.routingKey})，無匹配 Queue，訊息丟棄`);
            setMessageCounter(prev => prev + 1);
        }, [messageCounter, currentRoutingKey, exchangeType, addLog]);

        useEffect(() => {
            let interval;
            if (isAutoProduce) interval = setInterval(produceMessage, AUTO_PRODUCE_INTERVAL_MS);
            return () => clearInterval(interval);
        }, [isAutoProduce, produceMessage]);

        // Consumer polling
        useEffect(() => {
            const consumeInterval = setInterval(() => {                const currentQueues = [...queuesRef.current.map(q => ({ ...q, messages: [...q.messages] }))];
                const currentConsumers = [...consumersRef.current];
                let hasQueueChanges = false;
                let hasConsumerChanges = false;

                currentQueues.forEach((q, qIndex) => {
                    if (q.messages.length === 0) return;
                    const idleConsumers = currentConsumers.filter(c => c.targetQueue === q.id && c.state === 'idle');
                    idleConsumers.forEach(consumer => {
                        if (currentQueues[qIndex].messages.length > 0) {
                            const msgToProcess = currentQueues[qIndex].messages.shift();
                            hasQueueChanges = true;
                            const cIndex = currentConsumers.findIndex(c => c.id === consumer.id);
                            currentConsumers[cIndex] = { ...consumer, state: 'processing', currentMsg: msgToProcess };
                            hasConsumerChanges = true;
                            addLog(`[${consumer.id}] 從 ${q.id} 拿取 ${msgToProcess.text} 開始處理`);
                            setTimeout(() => {
                                setConsumers(prev => prev.map(c =>
                                    c.id === consumer.id ? { ...c, state: 'idle', currentMsg: null } : c
                                ));
                                addLog(`[${consumer.id}] ✅ 處理完畢 (Ack): ${msgToProcess.text} 已徹底銷毀`);
                            }, MESSAGE_PROCESSING_DURATION_MS);
                        }
                    });
                });

                if (hasQueueChanges) setQueues(currentQueues);
                if (hasConsumerChanges) setConsumers(currentConsumers);
            }, CONSUMER_POLL_INTERVAL_MS);
            return () => clearInterval(consumeInterval);
        }, [addLog]);

        const handleExchangeTypeChange = (type) => {
            setExchangeType(type);
            addLog(`[系統] 交換機模式已切換為：${type.toUpperCase()}`);
        };

        const addConsumer = (queueId) => {
            const queueConsumers = consumers.filter(c => c.targetQueue === queueId);
            if (queueConsumers.length < 3) {
                const newId = `C${consumers.length + 1}`;
                setConsumers(prev => [...prev, { id: newId, targetQueue: queueId, state: 'idle', currentMsg: null }]);
                addLog(`[系統] 已增加消費者 ${newId} 監聽 ${queueId}`);
            }
        };

        const removeConsumer = (queueId) => {
            const queueConsumers = consumers.filter(c => c.targetQueue === queueId);
            if (queueConsumers.length > 0) {
                const targetId = queueConsumers[queueConsumers.length - 1].id;
                setConsumers(prev => prev.filter(c => c.id !== targetId));
                addLog(`[系統] 已移除消費者 ${targetId}`);
            }
        };

        const getInsight = () => {
            if (exchangeType === 'fanout')
                return { type: 'info', text: "💡 Fanout (廣播) 模式：生產者發送的訊息會無視 Routing Key，直接複製並推播給所有綁定的 Queue。適合用於發布/訂閱系統的廣播訊息。" };
            if (currentRoutingKey !== 'info' && currentRoutingKey !== 'error')
                return { type: 'warning', text: "⚠️ 路由鍵未匹配：目前的 Routing Key 找不到任何對應的 Queue Binding Key。在 Direct 模式下，這筆訊息發送到 Exchange 後會直接被丟棄！" };
            return { type: 'success', text: "✅ Direct (直連) 模式：Exchange 會精準比對訊息的 Routing Key 和 Queue 的 Binding Key。當消費者處理完畢發送 Ack 後，該訊息就會被永久刪除。" };
        };
        const insight = getInsight();

        return (
            <div className="min-h-screen bg-slate-100 text-slate-800 p-4 md:p-8 font-sans">
                <div className="max-w-7xl mx-auto space-y-6">

                    <header className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h1 className="text-3xl font-bold flex items-center gap-3 text-slate-800">
                            <Network className="text-orange-500" size={32} />
                            RabbitMQ 核心機制視覺化模擬器
                        </h1>
                        <p className="text-slate-500 mt-2 text-lg">探索 Exchange 路由、Queue 儲存機制與 Consumer 的 Ack 確認流程。</p>
                    </header>

                    <div className={`p-4 rounded-xl border flex gap-4 items-start shadow-sm transition-colors duration-300 ${
                        insight.type === 'warning' ? 'bg-amber-50 border-amber-200 text-amber-800' :
                        insight.type === 'info'    ? 'bg-blue-50 border-blue-200 text-blue-800' :
                                                     'bg-emerald-50 border-emerald-200 text-emerald-800'}`}>
                        <Info className="mt-0.5 shrink-0" size={24} />
                        <p className="font-medium leading-relaxed text-sm md:text-base">{insight.text}</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">

                        {/* 左側：生產者與設定 */}
                        <div className="lg:col-span-3 space-y-6">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="font-bold text-lg mb-5 flex items-center gap-2 border-b pb-3 text-slate-700">
                                    <Send className="text-orange-500" size={20} /> 發布者 (Publisher)
                                </h2>
                                <div className="mb-4">
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Routing Key (路由鍵)</label>
                                    <select value={currentRoutingKey} onChange={(e) => setCurrentRoutingKey(e.target.value)}
                                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium focus:ring-2 focus:ring-orange-500 outline-none">
                                        <option value="info">info (匹配 Q1)</option>
                                        <option value="error">error (匹配 Q2)</option>
                                        <option value="unknown">unknown (不匹配)</option>
                                    </select>
                                </div>
                                <button onClick={produceMessage}
                                    className="w-full py-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-xl transition-colors font-semibold mb-3 flex items-center justify-center gap-2 shadow-sm active:scale-95">
                                    <Plus size={18} /> 發送單筆訊息
                                </button>
                                <button onClick={() => setIsAutoProduce(!isAutoProduce)}
                                    className={`w-full py-2.5 ${isAutoProduce ? 'bg-red-50 text-red-600 hover:bg-red-100 border-red-200 border' : 'bg-slate-50 text-slate-700 hover:bg-slate-100 border-slate-200 border'} rounded-xl transition-colors font-semibold flex items-center justify-center gap-2 shadow-sm active:scale-95`}>
                                    {isAutoProduce ? '停止自動發送' : '自動發送訊息'}
                                </button>
                            </div>

                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="font-bold text-lg mb-5 flex items-center gap-2 border-b pb-3 text-slate-700">
                                    <Settings2 className="text-slate-500" size={20} /> 交換機設定
                                </h2>
                                <div className="flex gap-2 bg-slate-100 p-1 rounded-xl">
                                    <button onClick={() => handleExchangeTypeChange('direct')}
                                        className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all ${exchangeType === 'direct' ? 'bg-white text-orange-600 shadow' : 'text-slate-500 hover:text-slate-700'}`}>
                                        Direct (直連)
                                    </button>
                                    <button onClick={() => handleExchangeTypeChange('fanout')}
                                        className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all ${exchangeType === 'fanout' ? 'bg-white text-orange-600 shadow' : 'text-slate-500 hover:text-slate-700'}`}>
                                        Fanout (廣播)
                                    </button>
                                </div>
                            </div>

                            <div className="bg-slate-900 text-green-400 p-4 rounded-2xl text-xs font-mono h-48 overflow-hidden relative shadow-inner flex flex-col">
                                <div className="text-slate-400 border-b border-slate-700 pb-2 mb-2 font-semibold flex justify-between">
                                    <span>終端機日誌</span>
                                    <span className="text-[10px] opacity-50">RabbitMQ Node</span>
                                </div>
                                <div className="overflow-y-auto flex-1 flex flex-col gap-1 pr-2 custom-scrollbar">
                                    {logs.map((log) => (
                                        <div key={log.id} className="opacity-90 break-all">
                                            <span className="text-slate-500 mr-2">[{log.time}]</span>{log.text}
                                        </div>
                                    ))}
                                    <div ref={endOfLogsRef} />
                                </div>
                            </div>
                        </div>

                        {/* 中間：交換機與佇列 */}
                        <div className="lg:col-span-6 flex flex-col gap-6">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border-2 border-orange-200 flex flex-col items-center justify-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-400 to-rose-400"></div>
                                <GitMerge className="text-orange-500 mb-2" size={32} />
                                <h3 className="font-bold text-xl text-slate-800">Exchange (交換機)</h3>
                                <span className="mt-1 bg-orange-100 text-orange-800 px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase">
                                    Mode: {exchangeType}
                                </span>
                            </div>

                            <div className="flex-1 flex flex-col gap-4">
                                {queues.map((queue) => (
                                    <div key={queue.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 relative flex flex-col transition-all">
                                        <div className="flex justify-between items-center mb-3">
                                            <div className="flex items-center gap-2">
                                                <List className="text-blue-500" size={18} />
                                                <span className="font-bold text-slate-700">{queue.name} ({queue.id})</span>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <span className="text-[10px] bg-slate-100 text-slate-600 px-2 py-1 rounded font-mono border border-slate-200">
                                                    Binding: <strong className="text-orange-600">{queue.bindingKey}</strong>
                                                </span>
                                                <div className="flex gap-1">
                                                    <button onClick={() => removeConsumer(queue.id)} className="p-1.5 bg-slate-50 border border-slate-200 rounded hover:bg-slate-100 transition-colors"><Minus size={14}/></button>
                                                    <button onClick={() => addConsumer(queue.id)}    className="p-1.5 bg-slate-50 border border-slate-200 rounded hover:bg-slate-100 transition-colors"><Plus  size={14}/></button>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="bg-slate-100 rounded-lg border-2 border-slate-200 border-dashed h-16 flex items-center p-2 overflow-hidden relative w-full">
                                            <div className="absolute right-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest pointer-events-none">Queue 入口 ⟵</div>
                                            <div className="absolute left-2  text-[10px] font-bold text-slate-400 uppercase tracking-widest pointer-events-none">⟶ 出口 (FIFO)</div>
                                            {queue.messages.length === 0 ? (
                                                <span className="text-slate-400 text-xs italic w-full text-center relative z-10">佇列空閒中...</span>
                                            ) : (
                                                <div className="flex gap-2 items-center justify-end w-full relative z-10 pr-16 pl-20">
                                                    {queue.messages.map((msg) => (
                                                        <div key={msg.id} className={`${msg.color} text-white text-xs font-bold px-3 py-1.5 rounded-md shadow-sm flex-shrink-0 animate-slide-in-right border border-black/10`}>
                                                            {msg.text}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* 右側：消費者 */}
                        <div className="lg:col-span-3 bg-slate-50 border-l border-slate-200 p-6 flex flex-col h-full rounded-r-2xl">
                            <h2 className="font-bold text-lg mb-5 flex items-center gap-2 border-b border-slate-200 pb-3 text-slate-700">
                                <MonitorPlay className="text-emerald-500" size={20} /> 消費者 (Workers)
                            </h2>
                            <div className="space-y-4 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                                {consumers.length === 0 && (
                                    <div className="text-sm text-slate-400 italic text-center py-4">尚無消費者</div>
                                )}
                                {consumers.map(consumer => {
                                    const isProcessing = consumer.state === 'processing';
                                    const queueColor = consumer.targetQueue === 'Q1' ? 'border-blue-300' : 'border-purple-300';
                                    return (
                                        <div key={consumer.id} className={`bg-white p-4 rounded-xl border-2 ${isProcessing ? 'border-emerald-400 shadow-md transform scale-105' : 'border-slate-200'} shadow-sm transition-all duration-300 relative`}>
                                            <div className="flex justify-between items-center mb-3">
                                                <span className="font-bold text-slate-700 flex items-center gap-2">
                                                    <div className={`w-2.5 h-2.5 rounded-full ${isProcessing ? 'bg-emerald-500 animate-pulse' : 'bg-slate-300'}`} />
                                                    {consumer.id}
                                                </span>
                                                <span className={`text-[10px] bg-slate-100 text-slate-600 px-2 py-1 rounded font-bold border ${queueColor}`}>
                                                    監聽: {consumer.targetQueue}
                                                </span>
                                            </div>
                                            <div className={`text-sm h-14 flex flex-col justify-center rounded-lg px-3 border ${isProcessing ? 'bg-emerald-50 border-emerald-100' : 'bg-slate-50 border-slate-100'}`}>
                                                {isProcessing && consumer.currentMsg ? (
                                                    <>
                                                        <div className="text-[10px] text-emerald-600 font-bold mb-1">處理中... 等待 Ack</div>
                                                        <span className={`${consumer.currentMsg.color} text-white px-2 py-0.5 text-xs font-bold rounded shadow-sm w-fit`}>
                                                            {consumer.currentMsg.text}
                                                        </span>
                                                    </>
                                                ) : (
                                                    <span className="text-xs italic text-slate-400 flex items-center gap-2">
                                                        <span className="loader-dots">閒置等待任務</span>
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('react-root')).render(<App />);
})();
</script>
</body>
</html>
